# InterviewOS Default Configuration
llm:
  base_url: http://localhost:11434/v1
  model: qwen2.5:14b
  temperature: 0.7
  max_tokens: 2048

embedding:
  model: BAAI/bge-small-zh-v1.5

database:
  url: sqlite+aiosqlite:///./interview_os.db

vector_store:
  type: faiss
  path: ./data/vectors

api:
  host: 127.0.0.1
  port: 8000
