[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-os"
version = "0.2.0"
description = "A Local LLM-powered Interview Intelligence Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "openai>=1.30.0",
]

[project.optional-dependencies]
local-llm = ["ollama>=0.3.0"]
speech = ["openai-whisper>=20231117", "pyannote.audio>=3.3.0"]
vector = ["faiss-cpu>=1.8.0", "sentence-transformers>=3.0.0"]
pdf = ["pypdf>=4.2.0", "pdfplumber>=0.11.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
